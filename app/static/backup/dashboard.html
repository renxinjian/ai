<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 - AI Platform</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>.flex-row{display:flex;gap:8px;flex-wrap:wrap}.stat-icon{font-size:36px}</style>
  <script src="/static/js/app.js"></script>
</head>
<body>
<nav class="sidebar"><nav class="sidebar"><div class="brand"><h1>🧠 <span>AI</span> Platform</h1><div class="tagline">统一能力平台</div></div><div class="nav"><div class="nav-group">核心</div><a href="/" class="nav-item"><span class="icon">🏠</span><span>仪表盘</span></a><a href="/wizard" class="nav-item"><span class="icon">🧩</span><span>技能工坊</span></a><a href="/llm-test" class="nav-item"><span class="icon">🤖</span><span>大模型测试</span></a><div class="nav-group">商店</div><a href="/store" class="nav-item"><span class="icon">🏪</span><span>技能商店</span></a><div class="nav-group">管理</div><a href="/market" class="nav-item"><span class="icon">📦</span><span>Market 安装</span></a><a href="/skills" class="nav-item"><span class="icon">📋</span><span>技能列表</span></a><div class="nav-group">分析</div><a href="/dashboard" class="nav-item active"><span class="icon">📊</span><span>数据看板</span></a><div class="nav-group">工具</div><a href="/playground" class="nav-item"><span class="icon">🧪</span><span>沙箱测试</span></a><a href="/db" class="nav-item"><span class="icon">🗄️</span><span>数据库</span></a></div></nav></nav>
<div class="main">
  <div class="topbar"><div><div class="breadcrumb"><a href="/">首页</a> / 数据看板</div><div class="page-title">📊 数据看板</div></div></div>
  <div class="content">
    <div class="grid-4" id="overview">
      <div class="stat-card"><div class="num" id="dSkills">-</div><div class="label">🛠️ 总技能数</div></div>
      <div class="stat-card"><div class="num" id="dExecs">-</div><div class="label">▶️ 执行次数</div></div>
      <div class="stat-card"><div class="num" id="dPassRate">-</div><div class="label">✅ 成功率</div></div>
      <div class="stat-card"><div class="num" id="dEngines">-</div><div class="label">⚙️ 引擎数</div></div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header"><div class="card-title">🏆 技能排行榜</div></div>
      <table><thead><tr><th>#</th><th>技能名</th><th>引擎</th><th>执行次数</th><th>最后执行</th></tr></thead><tbody id="rankBody"><tr><td colspan="5" style="color:var(--text-muted)">加载中...</td></tr></tbody></table>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header"><div class="card-title">📋 最近执行</div></div>
      <table><thead><tr><th>时间</th><th>技能</th><th>状态</th><th>耗时</th></tr></thead><tbody id="recentBody"><tr><td colspan="4" style="color:var(--text-muted)">暂无数据</td></tr></tbody></table>
    </div>
  </div>
</div>
<script>
async function load() {
  try {
    const s = await apiFetch('/stats');
    document.getElementById('dSkills').textContent = s.total_skills || 0;
    document.getElementById('dExecs').textContent = s.total_tests || 0;
    document.getElementById('dPassRate').textContent = (s.pass_rate||0)+'%';
    document.getElementById('dEngines').textContent = s.mcp_tools || 15;
  } catch(e) {}
  
  try {
    const h = await apiFetch('/history?limit=10');
    const b = document.getElementById('recentBody');
    if (h.history && h.history.length) {
      b.innerHTML = h.history.map(r => '<tr><td>'+(r.executed_at||'').slice(0,19)+'</td><td>'+(r.skill_name||'')+'</td><td><span class="badge badge-'+(r.status==='passed'?'success':'error')+'">'+r.status+'</span></td><td>'+r.duration_ms+'ms</td></tr>').join('');
    }
  } catch(e) {}
  
  try {
    const sk = await apiFetch('/skills');
    const tb = document.getElementById('rankBody');
    if (sk.skills && sk.skills.length) {
      const sorted = [...sk.skills].sort((a,b) => (b.test_count||0) - (a.test_count||0)).slice(0,15);
      tb.innerHTML = sorted.map((s,i) => '<tr><td>'+(i+1)+'</td><td>'+s.name+'</td><td>'+(s.category||'')+'</td><td>'+(s.test_count||0)+'</td><td>'+(s.updated_at||'').slice(0,10)+'</td></tr>').join('');
    }
  } catch(e) {}
}
load();
</script>
</body>
</html>
