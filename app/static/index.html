<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Platform</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
body{background:#070d1a;color:#e8edf5}
#app{display:flex;height:100vh}

/* 侧边栏 */
.sidebar{width:220px;background:#0b1428;border-right:1px solid #1a2d4a;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar .brand{padding:20px;border-bottom:1px solid #1a2d4a}
.sidebar .brand h1{font-size:18px;font-weight:700}
.sidebar .brand h1 span{color:#1a56d6}
.sidebar .brand .tag{font-size:10px;color:#556688;margin-top:2px}
.sidebar .nav{padding:8px 0;flex:1}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#8899bb;text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:.2s;cursor:pointer}
.sidebar .nav-item:hover{background:#0f1d35;color:#e8edf5}
.sidebar .nav-item.active{background:rgba(26,86,214,0.12);color:#1a56d6;border-left-color:#1a56d6}

/* 主区域 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:14px 28px;background:#0a1628;border-bottom:1px solid #1a2d4a;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.topbar .title{font-size:18px;font-weight:600}
.topbar .breadcrumb{font-size:12px;color:#556688}
.content{flex:1;overflow-y:auto;padding:24px 28px}

/* 卡片 */
.card{background:#0f1d35;border:1px solid #1a2d4a;border-radius:12px;padding:24px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stat-card{background:#0f1d35;border:1px solid #1a2d4a;border-radius:12px;padding:20px}
.stat-card .num{font-size:28px;font-weight:700;color:#1a56d6}
.stat-card .label{font-size:12px;color:#556688;margin-top:2px}

/* 表单 */
input,textarea,select{width:100%;background:#070d1a;border:1px solid #1a2d4a;color:#e8edf5;padding:10px 14px;border-radius:8px;font-size:13px;outline:0;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#1a56d6;box-shadow:0 0 0 3px rgba(26,86,214,0.3)}
textarea{min-height:80px;resize:vertical;font-family:monospace}
select{cursor:pointer}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-primary{background:#1a56d6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-success{background:#059690;color:#fff}.btn-success:hover{background:#0dcea6}
.btn-ghost{background:0 0;border:1px solid #1a2d4a;color:#8899bb}.btn-ghost:hover{border-color:#1a56d6;color:#e8edf5}
.btn-sm{padding:6px 14px;font-size:11px}

/* LLM 测试布局 */
.chat-layout{display:flex;height:calc(100vh - 110px);margin:-24px -28px}
.chat-sidebar{width:260px;background:#0b1428;border-right:1px solid #1a2d4a;padding:16px;overflow-y:auto;flex-shrink:0}
.chat-main{flex:1;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:14px 18px;border-radius:12px;font-size:14px;line-height:1.6}
.msg.user{background:#1a56d6;align-self:flex-end;border-bottom-right-radius:4px}
.msg.assistant{background:#0f1d35;align-self:flex-start;border:1px solid #1a2d4a;border-bottom-left-radius:4px}
.msg .meta{font-size:10px;color:#556688;margin-top:6px}
.chat-input{padding:14px 20px;border-top:1px solid #1a2d4a;display:flex;gap:12px}
.chat-input textarea{flex:1;min-height:44px;max-height:100px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:10px 14px;text-align:left;border-bottom:1px solid #1a2d4a}
th{color:#556688;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:rgba(26,86,214,0.04)}

/* 徽标 */
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600}
.badge-primary{background:rgba(26,86,214,0.15);color:#1a56d6}
.badge-success{background:rgba(5,150,144,0.15);color:#059690}
.badge-warning{background:rgba(217,119,10,0.15);color:#d9770a}

/* 弹窗 */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal .box{background:#0f1d35;border:1px solid #1a2d4a;border-radius:16px;padding:28px;width:500px;max-height:80vh;overflow-y:auto}

/* Toast */
.toast{position:fixed;top:24px;right:24px;padding:14px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999;animation:slideIn .3s}
.toast.success{background:#059690;color:#fff}
.toast.error{background:#ef4444;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* 工具 */
.hidden{display:none!important}
.mr-2{margin-right:8px}
.mt-2{margin-top:8px}
.mb-2{margin-bottom:8px}
.result-box{background:#070d1a;border:1px solid #1a2d4a;border-radius:8px;padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;color:#8899bb;margin-top:12px;max-height:300px;overflow:auto}
.skill-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:2px;transition:.2s}
.skill-item:hover{background:#0f1d35}
.skill-item.active{background:rgba(26,86,214,0.2)}

/* 模型管理表单 */
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:600;color:#8899bb;margin-bottom:4px}
.model-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #1a2d4a;border-radius:8px;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="brand"><h1>🧠 <span>AI</span> Platform</h1><div class="tag">统一能力平台</div></div>
    <div class="nav">
      <router-link to="/" class="nav-item" exact-active-class="active">🏠 仪表盘</router-link>
      <router-link to="/wizard" class="nav-item" active-class="active">🧩 技能工坊</router-link>
      <router-link to="/llm-test" class="nav-item" active-class="active">🤖 大模型测试</router-link>
      <router-link to="/store" class="nav-item" active-class="active">🏪 技能商店</router-link>
      <router-link to="/market" class="nav-item" active-class="active">📦 Market 安装</router-link>
      <router-link to="/skills" class="nav-item" active-class="active">📋 技能列表</router-link>
      <router-link to="/playground" class="nav-item" active-class="active">🧪 沙箱测试</router-link>
      <router-link to="/db" class="nav-item" active-class="active">🗄️ 数据库</router-link>
      <router-link to="/dashboard" class="nav-item" active-class="active">📊 数据看板</router-link>
    </div>
  </div>
  <div class="main">
    <router-view></router-view>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted, watch } = Vue;
const { createRouter, createWebHashHistory } = VueRouter;

// ─── API 服务 ───
const api = {
  async get(path) { const r = await fetch('/api' + path); return r.json(); },
  async post(path, body) { 
    const r = await fetch('/api' + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); 
    return r.json(); 
  },
  async put(path) { const r = await fetch('/api' + path, {method:'PUT'}); return r.json(); },
  async del(path) { const r = await fetch('/api' + path, {method:'DELETE'}); return r.json(); },
};

let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast') || (() => { const d = document.createElement('div'); d.id = 'toast'; document.body.appendChild(d); return d; })();
  el.className = 'toast ' + type; el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 3000);
}

// ─── 仪表盘 ───
const Dashboard = { template: '#dashboard-tpl' };

// ─── 技能工坊 ───
const Wizard = { 
  data: () => ({ presets: [], step: 1, currentSkill: null, result: null, loading: false }),
  async mounted() { const d = await api.get('/preset-skills'); this.presets = d.skills || []; },
  methods: {
    async select(s) {
      this.currentSkill = s;
      this.step = 2;
      // 加载完整模板
      try {
        const d = await api.get('/templates/' + s.id);
        this.currentSkill = d.template || d;
      } catch(e) {}
    },
    async run() {
      if (!this.currentSkill) return;
      this.loading = true;
      const inputData = {};
      if (this.currentSkill.inputs) {
        this.currentSkill.inputs.forEach(p => {
          const el = document.getElementById('p_' + p.key);
          if (el) inputData[p.key] = el.value;
        });
      }
      const r = await api.post('/skills/execute', {skill: this.currentSkill, input_data: inputData});
      this.result = r;
      this.step = 3;
      this.loading = false;
    },
    stepTo(n) { this.step = n; }
  },
  template: '#wizard-tpl'
};

// ─── 大模型测试 ───
const LlmTest = {
  data: () => ({
    skills: [], models: [], messages: [],
    currentSkillId: null, currentSkillName: '',
    inputText: '', modelId: '', temperature: 0.7, maxTokens: 500,
    provider: '⚡ 引擎模式', typing: false,
    showModelManager: false,
  newModel: {name:"DeepSeek API",provider:"deepseek",api_base:"https://api.deepseek.com/v1",api_key:"",model_name:"deepseek-chat"},
  providers: [
    {id:"deepseek",name:"DeepSeek",icon:"\ud83d\udfe2",base:"https://api.deepseek.com/v1",model:"deepseek-chat",docs:"https://platform.deepseek.com/api_keys"},
    {id:"openai",name:"OpenAI",icon:"\ud83d\udfe1",base:"https://api.openai.com/v1",model:"gpt-4o-mini",docs:"https://platform.openai.com/api-keys"},
    {id:"qwen",name:"\u901a\u4e49\u5343\u95ee",icon:"\ud83d\udd35",base:"https://dashscope.aliyuncs.com/compatible-mode/v1",model:"qwen-plus",docs:"https://help.aliyun.com/zh/model-studio/developer"},
    {id:"moonshot",name:"Moonshot",icon:"\ud83c\udf19",base:"https://api.moonshot.cn/v1",model:"moonshot-v1-8k",docs:"https://platform.moonshot.cn/console/api-keys"},
    {id:"baidu",name:"\u6587\u5fc3\u4e00\u8a00",icon:"\ud83d\udd34",base:"https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat",model:"ernie-4.0",docs:"https://console.bce.baidu.com/qianfan/ais/console/application"},
    {id:"zhipu",name:"GLM",icon:"\ud83d\udfe3",base:"https://open.bigmodel.cn/api/paas/v4",model:"glm-4-plus",docs:"https://open.bigmodel.cn/usercenter/apikeys"},
    {id:"minimax",name:"MiniMax",icon:"\ud83e\udd16",base:"https://api.minimax.chat/v1",model:"minimax-text-01",docs:"https://platform.minimax.com/user-center/basic"},
    {id:"custom",name:"\u81ea\u5b9a\u4e49",icon:"\u2699\ufe0f",base:"",model:"",docs:""},
  ],
  testingModel: false, testResult: null,

    execResult: null,
  }),
  async mounted() {
    try { const d = await api.get('/skills'); this.skills = d.skills || []; } catch(e) {}
    try { const d = await api.get('/models'); this.models = d.models || []; if (this.models.length) { this.modelId = this.models.find(m => m.is_active)?.id || this.models[0].id; } } catch(e) {}
  },
  methods: {
    selectSkill(id, name) { this.currentSkillId = id; this.currentSkillName = name; },
    async send() {
      const text = this.inputText.trim();
      if (!text) return;
      this.messages.push({role:'user', content: text});
      this.inputText = '';
      this.typing = true;
      
      // 如果有选中的 skill，执行它
      let skillTrace = '';
      if (this.currentSkillId) {
        const selected = this.skills.find(s => s.id == this.currentSkillId);
        if (selected) {
          try {
            const r = await api.post('/skills/execute', {
              skill: {engine: selected.category === 'market' ? 'calculator' : 'text_summary', name: selected.name},
              input_data: {text: text, numbers: (text.match(/\d+/g)||[]).map(Number)}
            });
            if (r.status === 'passed') {
              this.execResult = r.output;
              skillTrace = '\n\n📊 **Skill 执行结果 (' + selected.name + ')**\n' + JSON.stringify(r.output, null, 2).substring(0, 500);
            }
          } catch(e) {}
        }
      }
      
      try {
        const body = {messages: [{role:'user', content: text + skillTrace}], temperature: this.temperature, max_tokens: this.maxTokens};
        if (this.modelId) body.model_id = parseInt(this.modelId);
        const r = await api.post('/llm/call', body);
        this.typing = false;
        if (r.status === 'success') {
          this.messages.push({role:'assistant', content: r.content, meta: r.provider + '/' + (r.model_name||'')});
          this.provider = '✅ ' + (r.model_name||'模型');
        } else {
          this.messages.push({role:'assistant', content: r.content || '❌ ' + (r.error||'请求失败')});
          this.provider = '❌ 错误';
        }
      } catch(e) {
        this.typing = false;
        this.messages.push({role:'assistant', content: '❌ 请求失败: ' + e.message});
      }
    },
    async addModel() {
      const m = this.newModel;
      if (!m.name || !m.api_base) { showToast('名称和API地址必填','error'); return; }
      await api.post('/models', {name:m.name, provider:m.provider||'custom', api_base:m.api_base, api_key:m.api_key, model_name:m.model_name||'gpt-3.5-turbo', is_active:true});
      this.showModelManager = false;
      this.newModel = {name:'',provider:'custom',api_base:'',api_key:'',model_name:''};
      const d = await api.get('/models'); this.models = d.models || [];
      showToast('✅ 模型已添加');
    },
    getSelectedProvider() {
      var p = this.providers.find(function(x) { return x.id === this.newModel.provider; });
      return p || this.providers[this.providers.length-1];
    },
    onProviderChange() {
      var p = this.getSelectedProvider();
      this.newModel.api_base = p.base;
      this.newModel.model_name = p.model;
      this.newModel.name = p.name + ' API';
      this.testResult = null;
    },
    async testApiKey() {
      if (!this.newModel.api_key) { showToast('请输入 API Key','error'); return; }
      this.testingModel = true;
      this.testResult = null;
      try {
        var r = await fetch('/api/llm/test-key', {method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({api_base:this.newModel.api_base, api_key:this.newModel.api_key, model_name:this.newModel.model_name})});
        this.testResult = await r.json();
      } catch(e) { this.testResult = {success:false, message:'请求失败: '+e.message}; }
      this.testingModel = false;
    },
    async activateModel(id) { await api.put('/models/'+id+'/activate'); const d = await api.get('/models'); this.models = d.models || []; },
    async deleteModel(id) { if (!confirm('确定删除？')) return; await api.del('/models/'+id); const d = await api.get('/models'); this.models = d.models || []; },
  },
  template: '#llm-test-tpl'
};

// ─── 技能商店 ───
const Store = {
  data: () => ({ presets: [], search: '', category: 'all' }),
  computed: {
    filtered() {
      return this.presets.filter(s => {
        const matchCat = this.category === 'all' || s.category === this.category;
        const matchSearch = !this.search || s.name.includes(this.search) || (s.description||'').includes(this.search);
        return matchCat && matchSearch;
      });
    }
  },
  async mounted() { const d = await api.get('/preset-skills'); this.presets = d.skills || []; },
  methods: {
    async install(s) {
      await api.post('/skills', {name:s.name, description:s.description, category:'market', code:'# Engine: '+s.engine, status:'published'});
      showToast('✅ ' + s.name + ' 已安装');
    },
    async test(s) {
      const r = await api.post('/skills/execute', {skill:{engine:s.engine}, input_data:{text:'test', numbers:[1,2,3]}});
      showToast(r.status === 'passed' ? '✅ 运行正常' : '❌ ' + r.error, r.status === 'passed' ? 'success' : 'error');
    },
    setCat(c) { this.category = c; },
  },
  template: '#store-tpl'
};

// ─── Market 安装 ───
const Market = {
  data: () => ({ jsonInput: '', previewSkill: null, installed: [] }),
  async mounted() { const d = await api.get('/skills'); this.installed = d.skills || []; },
  methods: {
    preview() {
      try { this.previewSkill = JSON.parse(this.jsonInput); } catch(e) { showToast('JSON 格式错误','error'); this.previewSkill = null; }
    },
    async confirm() {
      if (!this.previewSkill) return;
      await api.post('/skills', {name:this.previewSkill.name, description:this.previewSkill.description||'', category:'market', code:'# .skill: imported', status:'published'});
      showToast('✅ 安装成功');
      this.previewSkill = null; this.jsonInput = '';
      const d = await api.get('/skills'); this.installed = d.skills || [];
    },
  },
  template: '#market-tpl'
};

// ─── 技能列表 ───
const SkillsList = {
  data: () => ({ skills: [] }),
  async mounted() { const d = await api.get('/skills'); this.skills = d.skills || []; },
  template: '#skills-tpl'
};

// ─── 沙箱测试 ───
const Playground = {
  data: () => ({ code: 'def main(d):\\n    return {"result": d.get("x",0)+d.get("y",0)}', inputJson: '{"x":10,"y":20}', result: null }),
  methods: {
    async run() {
      try {
        const inputData = JSON.parse(this.inputJson);
        this.result = await api.post('/test-run', {code: this.code, input_data: inputData});
      } catch(e) { this.result = {status:'error', error:'JSON 格式错误'}; }
    }
  },
  template: '#playground-tpl'
};

// ─── 数据库 ───
const Db = {
  data: () => ({ tables: [], sql: 'SELECT * FROM ai_skills ORDER BY category', queryResult: null }),
  async mounted() { try { const d = await api.get('/db/tables'); this.tables = d.tables || []; } catch(e) {} },
  methods: {
    async runQuery() { try { const d = await api.get('/db/query?sql=' + encodeURIComponent(this.sql)); this.queryResult = d; } catch(e) { this.queryResult = {error: e.message}; } }
  },
  template: '#db-tpl'
};

// ─── 数据看板 ───
const DataBoard = {
  data: () => ({ stats: {}, history: [], skills: [] }),
  async mounted() {
    try { this.stats = await api.get('/stats'); } catch(e) {}
    try { const d = await api.get('/history?limit=10'); this.history = d.history || []; } catch(e) {}
    try { const d = await api.get('/skills'); this.skills = d.skills || []; } catch(e) {}
  },
  computed: {
    ranked() { return [...this.skills].sort((a,b) => (b.test_count||0) - (a.test_count||0)).slice(0, 15); }
  },
  template: '#dashboard-tpl'
};

// ─── 路由 ───
const routes = [
  { path: '/', component: Dashboard },
  { path: '/wizard', component: Wizard },
  { path: '/llm-test', component: LlmTest },
  { path: '/store', component: Store },
  { path: '/market', component: Market },
  { path: '/skills', component: SkillsList },
  { path: '/playground', component: Playground },
  { path: '/db', component: Db },
  { path: '/dashboard', component: DataBoard },
];

const router = createRouter({ history: createWebHashHistory(), routes });
const app = createApp({});
app.use(router);
app.mount('#app');
</script>

<!-- 模板: 仪表盘 -->
<script type="text/x-template" id="dashboard-tpl">
<div class="main">
  <div class="topbar"><div><span class="breadcrumb">首页 / 仪表盘</span><div class="title">🏠 仪表盘</div></div><span class="badge badge-success">● 运行中</span></div>
  <div class="content">
    <div class="grid-4">
      <div class="stat-card"><div class="num">{{stats.total_skills||0}}</div><div class="label">📦 Skills</div></div>
      <div class="stat-card"><div class="num">{{stats.total_tests||0}}</div><div class="label">🧪 测试次数</div></div>
      <div class="stat-card"><div class="num">{{stats.pass_rate||0}}%</div><div class="label">✅ 通过率</div></div>
      <div class="stat-card"><div class="num">{{stats.mcp_tools||15}}</div><div class="label">⚙️ 引擎数</div></div>
    </div>
    <div class="grid-3" style="margin-top:24px">
      <router-link to="/wizard" class="card" style="text-decoration:none;color:inherit"><div style="font-size:32px;margin-bottom:8px">🧩</div><div class="card-title">技能工坊</div><div style="color:#8899bb;font-size:13px;margin-top:4px">零代码创建技能</div></router-link>
      <router-link to="/llm-test" class="card" style="text-decoration:none;color:inherit"><div style="font-size:32px;margin-bottom:8px">🤖</div><div class="card-title">大模型测试</div><div style="color:#8899bb;font-size:13px;margin-top:4px">对话式测试 Skill</div></router-link>
      <router-link to="/store" class="card" style="text-decoration:none;color:inherit"><div style="font-size:32px;margin-bottom:8px">🏪</div><div class="card-title">技能商店</div><div style="color:#8899bb;font-size:13px;margin-top:4px">浏览安装技能</div></router-link>
    </div>
  </div>
</div>
</script>

<!-- 模板: 技能工坊 -->
<script type="text/x-template" id="wizard-tpl">
<div class="main">
  <div class="topbar"><div><span class="breadcrumb">首页 / 技能工坊</span><div class="title">🧩 技能工坊</div></div><span class="badge badge-primary">零代码 · 三步创建</span></div>
  <div class="content">
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <span class="badge" :class="step>=1?'badge-primary':'badge'" style="padding:6px 16px">① 选技能</span>
      <span class="badge" :class="step>=2?'badge-primary':'badge'" style="padding:6px 16px">② 填参数</span>
      <span class="badge" :class="step>=3?'badge-primary':'badge'" style="padding:6px 16px">③ 看结果</span>
    </div>
    <div v-if="step===1" class="card">
      <div class="card-title" style="margin-bottom:16px">🎯 选择一个技能</div>
      <div class="grid-auto">
        <div v-for="s in presets" :key="s.id" class="card" style="padding:16px;cursor:pointer" @click="select(s)">
          <div style="font-size:28px;margin-bottom:4px">{{s.icon||'🧩'}}</div>
          <div style="font-size:14px;font-weight:600">{{s.name}}</div>
          <div style="font-size:11px;color:#8899bb">{{s.description}}</div>
        </div>
      </div>
    </div>
    <div v-if="step===2 && currentSkill" class="card">
      <div class="card-title" style="margin-bottom:16px">⚙️ {{currentSkill.name}} — 配置参数</div>
      <div v-for="p in (currentSkill.inputs||[])" :key="p.key" style="margin-bottom:14px">
        <label>{{p.label}}</label>
        <textarea v-if="p.type==='textarea'" :id="'p_'+p.key" :placeholder="p.placeholder||''">{{p.default||''}}</textarea>
        <select v-else-if="p.type==='select'" :id="'p_'+p.key">
          <option v-for="o in (p.options||[])" :key="o.value" :value="o.value" :selected="o.value===p.default">{{o.label}}</option>
        </select>
        <input v-else :id="'p_'+p.key" :value="p.default||''" :placeholder="p.placeholder||''">
      </div>
      <div style="margin-top:16px"><button class="btn btn-success" @click="run" :disabled="loading">{{loading?'⏳ 执行中...':'▶ 立即执行'}}</button><button class="btn btn-ghost mr-2" @click="stepTo(1)">← 换一个</button></div>
    </div>
    <div v-if="step===3 && result" class="card">
      <div class="card-title" style="margin-bottom:12px">📊 执行结果</div>
      <div class="result-box">{{JSON.stringify(result.output||result, null, 2)}}</div>
      <div style="margin-top:12px"><button class="btn btn-primary" @click="stepTo(2)">← 重新配置</button><button class="btn btn-ghost mr-2" @click="stepTo(1)">🔄 换一个</button></div>
    </div>
  </div>
</div>
</script>

<!-- 模板: 大模型测试 -->
<script type="text/x-template" id="llm-test-tpl">
<div class="main">
  <div class="topbar" style="flex-shrink:0">
    <div><span class="breadcrumb">首页 / 大模型测试</span><div class="title">🤖 大模型测试</div></div>
    <span class="badge" :class="provider.includes('✅')?'badge-success':(provider.includes('❌')?'badge-warning':'badge-warning')">{{provider}}</span>
  </div>
  <div class="chat-layout">
    <div class="chat-sidebar">
      <div style="font-size:11px;color:#556688;margin-bottom:8px">📦 已安装 {{skills.length}} 个技能</div>
      <div v-for="s in skills" :key="s.id" class="skill-item" :class="{active:currentSkillId==s.id}" @click="selectSkill(s.id,s.name)">
        🧩 {{s.name}}<br><small style="color:#556688">{{s.category}} · {{s.test_count||0}}次</small>
      </div>
    </div>
    <div class="chat-main">
      <div class="chat-msgs" ref="msgArea">
        <div class="msg assistant" v-if="messages.length===0">👋 选择左侧技能测试，或直接输入消息</div>
        <div v-for="(m,i) in messages" :key="i" :class="'msg '+m.role">
          <div style="white-space:pre-wrap">{{m.content}}</div>
          <div class="meta" v-if="m.meta">{{m.meta}}</div>
        </div>
        <div class="msg assistant" v-if="typing"><div style="display:flex;gap:4px"><span style="width:6px;height:6px;background:#556688;border-radius:50%;animation:1.4s infinite bounce"> </span><span style="width:6px;height:6px;background:#556688;border-radius:50%;animation:1.4s .2s infinite bounce"> </span><span style="width:6px;height:6px;background:#556688;border-radius:50%;animation:1.4s .4s infinite bounce"> </span></div></div>
        <div class="msg assistant" v-if="execResult" style="background:#070d1a;font-family:monospace;font-size:12px">
          <div style="font-weight:600;margin-bottom:4px;color:#059690">🧩 Skill 执行结果</div>
          <pre style="white-space:pre-wrap;color:#8899bb">{{JSON.stringify(execResult,null,2)}}</pre>
        </div>
      </div>
      <div style="padding:8px 20px;border-top:1px solid #1a2d4a;display:flex;gap:12px;align-items:center;font-size:12px;background:#0a1628;flex-shrink:0;flex-wrap:wrap">
        <label>🌡️ <input type="range" v-model.number="temperature" min="0" max="2" step="0.1" style="width:80px"> {{temperature}}</label>
        <label>Max: <input type="number" v-model.number="maxTokens" style="width:60px"></label>
        <label>🤖 <select v-model="modelId" style="width:150px">
          <option value="">— 选择模型 —</option>
          <option v-for="m in models" :key="m.id" :value="m.id">{{m.is_active?'🟢':'⚪'}} {{m.name}}</option>
        </select></label>
        <button class="btn btn-ghost btn-sm" @click="showModelManager=true">⚙️ 管理</button>
      </div>
      <div class="chat-input">
        <textarea v-model="inputText" rows="1" placeholder="输入消息，Enter 发送..." @keydown.enter.exact.prevent="send"></textarea>
        <button class="btn btn-primary" @click="send" :disabled="typing">发送</button>
      </div>
    </div>
  </div>

  <!-- 模型管理弹窗 -->
  <div class="modal" v-if="showModelManager" @click.self="showModelManager=false">
    <div class="box">
      <div style="display:flex;justify-content:space-between;margin-bottom:20px"><h3 style="font-size:18px">⚙️ 模型管理</h3><button @click="showModelManager=false" style="background:none;border:none;color:#556688;font-size:20px;cursor:pointer">✕</button></div>
      <div v-for="m in models" :key="m.id" class="model-item">
        <div><b>{{m.is_active?'🟢':'⚪'}} {{m.name}}</b><br><small style="color:#556688">{{m.provider}} · {{m.model_name}}</small></div>
        <div><button class="btn btn-ghost btn-sm" v-if="!m.is_active" @click="activateModel(m.id)">使用</button><button class="btn btn-ghost btn-sm" style="color:#ef4444" @click="deleteModel(m.id)">删除</button></div>
      </div>
      <div v-if="models.length===0" style="color:#556688;text-align:center;padding:16px">暂无模型，请添加</div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid #1a2d4a">
        <div style="font-weight:600;margin-bottom:12px">＋ 添加模型</div>
        <div class="form-row"><label>选择厂商</label><select v-model="newModel.provider" @change="onProviderChange"><option v-for="p in providers" :key="p.id" :value="p.id">{{p.icon}} {{p.name}}</option></select></div>
        <div class="form-row"><label>名称</label><input v-model="newModel.name" placeholder="DeepSeek API"></div>
        <div class="form-row"><label>API 地址</label><input :value="getSelectedProvider().base" readonly style="background:#0a121f;color:#556688"></div>
        <div class="form-row"><label>API Key <a :href="getSelectedProvider().docs" target="_blank" style="color:#60a5fa;font-size:11px;margin-left:8px" v-if="getSelectedProvider().docs">获取 Key</a></label><input v-model="newModel.api_key" type="password" placeholder="输入你的 API Key..."></div>
        <div class="form-row"><label>模型名</label><input :value="getSelectedProvider().model" readonly style="background:#0a121f;color:#8899bb"></div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-primary" @click="testApiKey" :disabled="testingModel || !newModel.api_key" style="flex:1;justify-content:center">{{testingModel ? '\u23f3 \u6d4b\u8bd5\u4e2d...' : '\u25b6 \u6d4b\u8bd5\u8fde\u63a5'}}</button>
          <button class="btn btn-success" @click="addModel" style="flex:1;justify-content:center">+ 添加</button>
        </div>
        <div v-if="testResult" style="margin-top:12px;padding:10px 14px;border-radius:8px" :style="{background:testResult.success?'rgba(5,150,144,0.1)':'rgba(239,68,68,0.1)'}">
          <div style="font-weight:600;font-size:13px">{{testResult.success ? '\u2705 \u8fde\u63a5\u6210功' : '\u274c \u8fde\u63a5\u5931\u8d25'}}</div>
          <div style="font-size:12px;color:#8899bb;margin-top:4px;white-space:pre-wrap">{{testResult.message}}</div>
        </div>
      </div>
    </div>
  </div>
</div>
</script>

<!-- 模板: 技能商店 -->
<script type="text/x-template" id="store-tpl">
<div class="main">
  <div class="topbar"><div><span class="breadcrumb">首页 / 技能商店</span><div class="title">🏪 技能商店</div></div><span class="badge badge-primary">{{presets.length}} 个技能</span></div>
  <div class="content">
    <input v-model="search" placeholder="🔍 搜索技能..." style="margin-bottom:16px">
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" :class="category==='all'?'badge-primary':''" @click="setCat('all')">🔥 全部</button>
      <button v-for="c in ['text','data','tools','security','custom']" :key="c" class="btn btn-ghost btn-sm" :class="category===c?'badge-primary':''" @click="setCat(c)">{{c}}</button>
    </div>
    <div class="grid-auto">
      <div v-for="s in filtered" :key="s.id" class="card" style="padding:20px">
        <div style="font-size:32px;margin-bottom:8px">{{s.icon||'🧩'}}</div>
        <div style="font-weight:600;font-size:15px">{{s.name}}</div>
        <div style="color:#8899bb;font-size:12px;margin:4px 0 12px">{{s.description}}</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-success btn-sm" @click="install(s)">📦 安装</button>
          <button class="btn btn-ghost btn-sm" @click="test(s)">▶ 试玩</button>
        </div>
      </div>
    </div>
  </div>
</div>
</script>

<!-- 模板: Market -->
<script type="text/x-template" id="market-tpl">
<div class="main">
  <div class="topbar"><div><span class="breadcrumb">首页 / Market 安装</span><div class="title">📦 Market 安装</div></div></div>
  <div class="content">

      <div class="card-title" style="margin-bottom:12px">📋 粘贴 .skill JSON</div>
