<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型测试 - AI Platform</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
.chat-layout{display:flex;gap:0;height:calc(100vh - 120px);margin:-28px -32px}
.chat-sidebar{width:280px;background:var(--bg-sidebar);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}.skill-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:2px;transition:var(--transition)}.skill-item:hover{background:var(--bg-card)}.skill-item.active{background:rgba(26,86,214,0.2)}
.chat-main{flex:1;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
</style>
<script src="/static/js/app.js"></script>
</head>
<body>
<nav class="sidebar"><nav class="sidebar"><div class="brand">
    <h1>🧠 <span>AI</span> Platform</h1>
    <div class="tagline">统一能力平台</div>
  </div>
  <div class="nav">
    <div class="nav-group">核心</div>
    <a href="/" class="nav-item"><span class="icon">🏠</span><span>仪表盘</span></a>
    <a href="/wizard" class="nav-item"><span class="icon">🧩</span><span>技能工坊</span></a>
    <a href="/llm-test" class="nav-item active" class="nav-item active" class="nav-item active" class="nav-item"><span class="icon">🤖</span><span>大模型测试</span></a>
    <div class="nav-group">管理</div>
    <a href="/store" class="nav-item"><span class="icon">🏪</span><span>技能商店</span></a>
    <a href="/market" class="nav-item"><span class="icon">📦</span><span>Market 安装</span></a>
    <a href="/skills" class="nav-item"><span class="icon">📋</span><span>技能列表</span></a>
    <a href="/editor" class="nav-item"><span class="icon">✏️</span><span>代码编辑器</span></a>
    <div class="nav-group">分析</div><a href="/dashboard" class="nav-item"><span class="icon">📊</span><span>数据看板</span></a>
    <div class="nav-group">工具</div>
    <a href="/playground" class="nav-item"><span class="icon">🧪</span><span>沙箱测试</span></a>
    <a href="/db" class="nav-item"><span class="icon">🗄️</span><span>数据库</span></a>
    <a href="/docs" class="nav-item"><span class="icon">📡</span><span>API 文档</span></a>
  </div></nav></nav>
<div class="main">
  <div class="topbar"><div><div class="breadcrumb"><a href="/">首页</a> / 大模型测试</div><div class="page-title">🤖 大模型测试</div></div><div><span id="providerBadge" class="badge badge-warning">引擎模式</span></div></div>
  <div class="chat-layout">
    <div class="chat-sidebar">
      <button class="btn btn-ghost-sm" onclick="testNoSkill()" style="width:100%;margin-bottom:12px">💬 纯对话</button>
      <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">📦 已安装 Skills</div>
      <div id="skillList"></div>
    </div>
    <div class="chat-main">
      <div class="chat-msgs" id="msgArea"><div class="msg assistant">你好！选择左侧 Skill 测试或直接对话 👋</div></div>
      <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:16px;align-items:center;font-size:12px;background:var(--bg-dark)">
        <label>🌡️ <input type="range" id="tempSlider" min="0" max="2" step="0.1" value="0.7" style="width:80px;vertical-align:middle"> <span id="tempVal">0.7</span></label>
        <label>Max: <input type="number" id="maxTokens" value="500" style="width:60px"></label>
      </div>
      <div class="chat-input">
        <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="btn btn-primary" onclick="sendMsg()">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
let skills = [];
let currentSkillId = null;


async function loadSkills() {
async function loadSkills() {
  const list = document.getElementById('skillList');
  list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:8px">⏳ 加载中...</div>';
  try {
    const r = await fetch('/api/skills');
    const d = await r.json();
    const skills = d.skills || [];
    if (skills.length) {
      list.innerHTML = '<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">已安装 '+skills.length+' 个技能</div>' +
        skills.map(s => '<div class="skill-item" onclick="selectSkill('+s.id+',\''+(s.name||'').replace(/'/g,'')+'\',\''+((s.description||'')||'').replace(/'/g,'').substring(0,30)+'\')">🧩 '+s.name+'<br><small style=\"color:var(--text-muted)\">'+(s.category||'')+' \u00b7 '+(s.test_count||0)+'\u6b21</small></div>').join('');
    } else {
      fallbackLoad();
    }
  } catch(e) { fallbackLoad(); }
}

async function fallbackLoad() {
  const list = document.getElementById('skillList');
  try {
    const r = await fetch('/api/preset-skills');
    const d = await r.json();
    const ps = d.skills || [];
    if (ps.length) {
      list.innerHTML = '<div style="font-size:11px;color:#f59e0b;margin-bottom:4px">\u26a0\ufe0f 商店预设</div>' +
        ps.slice(0,10).map(s => '<div class=\"skill-item\" onclick=\"testEngine(\''+s.engine+'\',\''+s.name+'\')\" style=\"opacity:0.7\">'+(s.icon||'\U0001f9e9')+' '+s.name+'<br><small style=\"color:var(--text-muted)\">'+s.category+'</small></div>').join('');
    }
  } catch(e) { list.innerHTML = '<div style="color:var(--error)">\u274c \u52a0\u8f7d\u5931\u8d25</div>'; }
}

function testEngine(engine, name) {
  addMsg('user','\u25b6 '+name);
  showTyping();
  fetch('/api/skills/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill:{engine:engine},input_data:{text:'test',numbers:[1,2,3]}})})
    .then(r=>r.json()).then(r=>{removeTyping();document.getElementById('execResultArea').classList.remove('hidden');if(r.status==='passed'){document.getElementById('execOutput').textContent=JSON.stringify(r.output,null,2);addMsg('assistant','\\u2705 '+name);}else{addMsg('assistant','\\u274c '+r.error);}}).catch(()=>{removeTyping()});
}


}

function selectSkill(id, name, desc) {
  currentSkillId = id;
  document.querySelectorAll('.skill-item').forEach(e => e.classList.remove('active'));
  try { event.currentTarget.classList.add('active'); } catch(e) {}
  document.getElementById('execResultArea').classList.add('hidden');
  addMsg('assistant', `已选择: **${name}**\n${desc}\n\n输入测试数据或直接点下方的快速测试按钮`);
}

async function quickTest(type, label) {
  let skill, inputData;
  
  // 根据类型查找对应的引擎和生成测试数据
  const engineMap = {
    '摘要': {engine: 'text_summary', data: {text: '人工智能正在改变世界。深度学习让计算机能够识别图像。大语言模型可以理解和生成文本。'}},
    '计算': {engine: 'calculator', data: {numbers: [23, 45, 67, 12, 89, 34]}},
    '问候': {engine: 'greeting', data: {name: '朋友', style: 'warm', language: 'zh'}},
    '翻译': {engine: 'translator', data: {text: '你好世界', direction: 'zh_to_en'}},
    '密码': {engine: 'password_gen', data: {length: 16, count: 3}},
  };
  
  const cmd = engineMap[label];
  if (!cmd) return;
  
  // 执行引擎
  addMsg('user', `▶ 测试: ${label}`);
  showTyping();
  
  try {
    const r = await fetch('/api/skills/execute', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({skill: {engine: cmd.engine}, input_data: cmd.data})
    });
    const result = await r.json();
    removeTyping();
    
    document.getElementById('execResultArea').classList.remove('hidden');
    if (result.status === 'passed') {
      document.getElementById('execOutput').textContent = JSON.stringify(result.output, null, 2);
      addMsg('assistant', `✅ **${label}** 执行成功 (${result.engine})`);
    } else {
      document.getElementById('execOutput').textContent = '❌ ' + result.error;
      addMsg('assistant', `❌ **${label}** 执行失败`);
    }
  } catch(e) {
    removeTyping();
    addMsg('assistant', '❌ 请求失败: ' + e.message);
  }
}

async function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMsg('user', text);
  showTyping();
  
  try {
    const r = await fetch('/api/llm/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        messages: [{role: 'user', content: text}],
        temperature: parseFloat(document.getElementById('tempSlider').value),
        max_tokens: parseInt(document.getElementById('maxTokens').value),
      })
    });
    const d = await r.json();
    removeTyping();
    addMsg('assistant', d.content || '无响应', d.provider);
    document.getElementById('providerBadge').textContent = d.provider === 'openclaw' ? '✅ LLM 在线' : '⚡ 引擎模式';
    document.getElementById('providerBadge').className = 'badge ' + (d.provider === 'openclaw' ? 'badge-success' : 'badge-warning');
  } catch(e) {
    removeTyping();
    addMsg('assistant', '❌ 请求失败');
  }
}

function addMsg(role, content, provider) {
  const a = document.getElementById('msgArea');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = content.replace(/\n/g, '<br>') + (provider ? '<div class="meta">via ' + provider + '</div>' : '');
  a.appendChild(d);
  a.scrollTop = a.scrollHeight;
}

function showTyping() {
  const a = document.getElementById('msgArea');
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.id = 'typing';
  d.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  a.appendChild(d);
  a.scrollTop = a.scrollHeight;
}

function removeTyping() {
  const e = document.getElementById('typing');
  if (e) e.remove();
}

document.getElementById('tempSlider').addEventListener('input', function() {
  document.getElementById('tempVal').textContent = this.value;
});

loadSkills();
</script>
</body>
</html>
